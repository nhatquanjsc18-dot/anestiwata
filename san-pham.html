<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue Sản Phẩm — Anest Iwata Việt Nam</title>
<meta name="description" content="Toàn bộ catalogue thiết bị phun sơn, máy nén khí, bơm chân không, hệ thống cấp liệu sơn và phụ kiện Anest Iwata chính hãng.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="aiHeader"></div>

<section class="section" style="padding-bottom:0;">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="section-eyebrow">Catalogue đầy đủ</span>
        <h2>Toàn bộ sản phẩm Anest Iwata</h2>
        <p>Tìm kiếm và lọc theo danh mục để chọn đúng thiết bị phù hợp với nhu cầu xưởng của bạn.</p>
      </div>
    </div>

    <div class="product-toolbar">
      <div class="search-box"><input type="text" id="searchInput" placeholder="Tìm theo tên sản phẩm, model..."></div>
      <div class="result-count" id="resultCount"></div>
    </div>

    <div class="tab-row" id="catTabs"></div>
    <div class="subcat-row" id="subCatRow"></div>

    <div class="product-grid" id="productGrid"></div>
  </div>
</section>

<div style="height:60px;"></div>
<div id="aiFooter"></div>

<script src="js/products-data.js"></script>
<script src="js/products-data-2.js"></script>
<script src="js/products-data-3.js"></script>
<script src="js/products-data-4.js"></script>
<script src="js/products-data-5.js"></script>
<script src="js/products-data-6.js"></script>
<script src="js/layout.js"></script>
<script src="js/catalog.js"></script>
<script>
  aiMountLayout("products");
</script>
</body>
</html>
